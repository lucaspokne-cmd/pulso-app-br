plugins { id 'com.android.application' }
android {
    namespace 'br.com.pulso.app'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.pulso.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (System.getenv('PULSE_KEYSTORE_PATH')) {
                storeFile file(System.getenv('PULSE_KEYSTORE_PATH'))
                storePassword System.getenv('PULSE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PULSE_KEY_ALIAS')
                keyPassword System.getenv('PULSE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('PULSE_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
}
